<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استديو VIDEO-LIKE العربي الذكي</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .style-btn.active {
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-color: #fdba74;
            color: white;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .mood-btn.active {
            background: #3b82f6;
            border-color: #93c5fd;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <!-- الترويسة -->
    <header class="text-center max-w-2xl mb-8">
        <span class="px-3 py-1 text-xs font-bold tracking-wider text-orange-400 uppercase bg-orange-500/10 rounded-full border border-orange-500/20">
            مدعوم ببنية WebSocket فائقة الخفة
        </span>
        <h1 class="text-3xl md:text-5xl font-black mt-3 bg-gradient-to-l from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            استديو VIDEO-LIKE العربي
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base">
            اكتب فكرتك، اختر النمط والخصائص، وسيقوم المحرك ببناء السكربت والبرومبت الاحترافي فوراً.
        </p>
    </header>

    <!-- لوحة التحكم الرئيسية -->
    <main class="w-full max-w-4xl glass-panel rounded-3xl p-6 md:p-8 shadow-2xl">
        
        <!-- 1. خانة كتابة الفكرة -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-300 mb-2">💡 فكرة الفيديو أو الموضوع:</label>
            <textarea id="videoIdea" rows="3" 
                class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl p-4 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition"
                placeholder="مثال: اشرح كيف ابتكر الجزري الساعات الميكانيكية بأسلوب مشوق..."></textarea>
        </div>

        <!-- 2. اختيار نمط التصميم -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-300 mb-3">🎨 اختر نمط التصميم والحركة:</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="styleContainer">
                <button type="button" onclick="selectStyle(this, 'موشن جرافيك حديث')" class="style-btn active border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">موشن جرافيك</button>
                <button type="button" onclick="selectStyle(this, 'تيك توك وريلز سريع')" class="style-btn border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">تيك توك سريع</button>
                <button type="button" onclick="selectStyle(this, 'رسوم متحركة ثلاثية الأبعاد')" class="style-btn border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">كرتون 3D</button>
                <button type="button" onclick="selectStyle(this, 'شرح تقني مستقبلي')" class="style-btn border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">تقني / نيون</button>
                <button type="button" onclick="selectStyle(this, 'سرد تاريخي وتراثي')" class="style-btn border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">تاريخي وتراثي</button>
                <button type="button" onclick="selectStyle(this, 'قصص كوميكس ومانجا')" class="style-btn border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">كوميكس ومانجا</button>
                <button type="button" onclick="selectStyle(this, 'رسم سبورة بيضاء')" class="style-btn border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">سبورة بيضاء</button>
                <button type="button" onclick="selectStyle(this, 'خطوط عربية حرة')" class="style-btn border border-slate-700 bg-slate-800/50 py-3 px-4 rounded-xl text-sm font-semibold transition hover:border-orange-400">خطوط عربية</button>
            </div>
        </div>

        <!-- 3. اختيار الخصائص المزاجية الثلاث -->
        <div class="mb-8">
            <label class="block text-sm font-bold text-slate-300 mb-3">⚙️ إعدادات الإخراج والإيقاع:</label>
            <div class="grid grid-cols-3 gap-3" id="moodContainer">
                <button type="button" onclick="selectMood(this, 'وثائقي')" class="mood-btn border border-slate-700 bg-slate-800/50 py-2.5 rounded-xl text-sm font-bold transition">📄 وثائقي (رصين)</button>
                <button type="button" onclick="selectMood(this, 'سينمائي')" class="mood-btn active border border-slate-700 bg-slate-800/50 py-2.5 rounded-xl text-sm font-bold transition">🎬 سينمائي (عميق)</button>
                <button type="button" onclick="selectMood(this, 'ديناميكي')" class="mood-btn border border-slate-700 bg-slate-800/50 py-2.5 rounded-xl text-sm font-bold transition">⚡ ديناميكي (سريع)</button>
            </div>
        </div>

        <!-- زر التشغيل -->
        <button onclick="startProduction()" id="generateBtn"
            class="w-full py-4 rounded-2xl font-black text-lg bg-gradient-to-l from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white shadow-lg shadow-orange-500/20 transition transform active:scale-[0.99]">
            🚀 توليد البرومبت وبناء المشاهد الآن
        </button>

        <!-- شريط الحالة الحي (WebSocket Status) -->
        <div id="statusBox" class="hidden mt-6 p-4 rounded-2xl bg-slate-900/90 border border-slate-700/80 flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-orange-500 animate-ping"></div>
            <span id="statusText" class="text-sm font-semibold text-slate-200">جاري الاتصال بالاستديو...</span>
        </div>

        <!-- صندوق عرض النتيجة والبرومبت الاحترافي -->
        <div id="resultBox" class="hidden mt-6 space-y-4">
            <h3 class="text-lg font-bold text-emerald-400">✨ المخرجات الهندسية الجاهزة لأداة VIDEO-LIKE:</h3>
            <div id="scenesOutput" class="space-y-3"></div>
        </div>

    </main>

    <script>
        let selectedStyle = 'موشن جرافيك حديث';
        let selectedMood = 'سينمائي';
        
        // تحديد رابط الـ WebSocket تلقائياً ليتوافق مع Render (wss) أو المحلي (ws)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/studio`;
        let socket;

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);
            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const statusBox = document.getElementById('statusBox');
                const statusText = document.getElementById('statusText');
                
                statusBox.classList.remove('hidden');
                statusText.innerText = data.msg;

                if (data.step === 3 && data.generated_payload) {
                    renderScenes(data.generated_payload.scenes);
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('generateBtn').innerText = '🚀 توليد البرومبت وبناء المشاهد الآن';
                }
            };
        }

        connectWebSocket();

        function selectStyle(btn, style) {
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedStyle = style;
        }

        function selectMood(btn, mood) {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedMood = mood;
        }

        function startProduction() {
            const idea = document.getElementById('videoIdea').value.trim();
            if (!idea) {
                alert('يرجى كتابة فكرة الفيديو أولاً!');
                return;
            }

            if (socket.readyState !== WebSocket.OPEN) {
                connectWebSocket();
            }

            document.getElementById('generateBtn').disabled = true;
            document.getElementById('generateBtn').innerText = '⏳ جاري المعالجة السحابية...';
            document.getElementById('resultBox').classList.add('hidden');

            socket.send(JSON.stringify({
                idea: idea,
                style: selectedStyle,
                mood: selectedMood
            }));
        }

        function renderScenes(scenes) {
            const container = document.getElementById('scenesOutput');
            container.innerHTML = '';
            document.getElementById('resultBox').classList.remove('hidden');

            scenes.forEach(scene => {
                const card = document.createElement('div');
                card.className = 'p-4 rounded-2xl bg-slate-800/70 border border-slate-700 space-y-2';
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-slate-400">
                        <span class="font-bold text-orange-400">المشهد #${scene.scene_number}</span>
                        <span class="bg-slate-900 px-2 py-1 rounded-md">الانتقال: ${scene.transition}</span>
                    </div>
