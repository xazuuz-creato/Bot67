<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استديو VIDEO-LIKE العربي الذكي</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }
        .header { text-align: center; max-width: 700px; margin-bottom: 30px; }
        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; color: #ffffff; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; }
        
        .studio-card {
            width: 100%;
            max-width: 850px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .section-label { display: block; font-size: 0.95rem; font-weight: 700; color: #cbd5e1; margin-bottom: 12px; }
        textarea {
            width: 100%;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 15px;
            color: #ffffff;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 25px;
            transition: border-color 0.3s;
        }
        textarea:focus { outline: none; border-color: #f97316; }

        .grid-styles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }
        .grid-moods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        .option-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .option-btn:hover { border-color: #f97316; transform: translateY(-2px); }
        .option-btn.active-style {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border-color: #fdba74;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }
        .option-btn.active-mood {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-color: #93c5fd;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #f97316 0%, #d97706 100%);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.3);
            transition: all 0.3s;
        }
        .submit-btn:hover { filter: brightness(1.1); }
        .submit-btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

        .status-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            font-weight: 600;
            text-align: center;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .results-container { display: none; margin-top: 30px; }
        .results-title { font-size: 1.2rem; color: #34d399; margin-bottom: 15px; font-weight: 800; }
        .scene-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .scene-num { color: #fb923c; font-weight: 900; font-size: 1rem; }
        .narration-text { font-size: 1.05rem; font-weight: 700; color: #ffffff; margin-bottom: 12px; line-height: 1.6; }
        .prompt-box {
            background: #090d16;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #34d399;
            direction: ltr;
            text-align: left;
            position: relative;
        }
        .copy-btn {
            margin-top: 10px;
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .copy-btn:hover { background: #f97316; }
    </style>
</head>
<body>

    <div class="header">
        <span class="badge">✨ مدعوم بمحرك Gemini السحابي فائق السرعة</span>
        <h1>استديو VIDEO-LIKE العربي</h1>
        <p class="subtitle">اكتب فكرتك، اختر النمط والخصائص، وسيقوم المحرك ببناء السكربت والبرومبت الاحترافي فوراً.</p>
    </div>

    <div class="studio-card">
        <label class="section-label">💡 فكرة الفيديو أو الموضوع:</label>
        <textarea id="videoIdea" rows="3" placeholder="مثال: فيديو وثائقي عن تاريخ اليمن وحضارة سبأ بأسلوب مشوق..."></textarea>

        <label class="section-label">🎨 اختر نمط التصميم والحركة:</label>
        <div class="grid-styles" id="styleContainer">
            <button type="button" class="option-btn active-style" onclick="setStyle(this, 'موشن جرافيك حديث')">موشن جرافيك</button>
            <button type="button" class="option-btn" onclick="setStyle(this, 'تيك توك وريلز سريع')">تيك توك سريع</button>
            <button type="button" class="option-btn" onclick="setStyle(this, 'رسوم متحركة ثلاثية الأبعاد')">كرتون 3D</button>
            <button type="button" class="option-btn" onclick="setStyle(this, 'شرح تقني مستقبلي')">تقني / نيون</button>
            <button type="button" class="option-btn" onclick="setStyle(this, 'سرد تاريخي وتراثي')">تاريخي وتراثي</button>
            <button type="button" class="option-btn" onclick="setStyle(this, 'قصص كوميكس ومانجا')">كوميكس ومانجا</button>
            <button type="button" class="option-btn" onclick="setStyle(this, 'رسم سبورة بيضاء')">سبورة بيضاء</button>
            <button type="button" class="option-btn" onclick="setStyle(this, 'خطوط عربية حرة')">خطوط عربية</button>
        </div>

        <label class="section-label">⚙️ إعدادات الإخراج والإيقاع:</label>
        <div class="grid-moods" id="moodContainer">
            <button type="button" class="option-btn" onclick="setMood(this, 'وثائقي')">📄 وثائقي (رصين)</button>
            <button type="button" class="option-btn active-mood" onclick="setMood(this, 'سينمائي')">🎬 سينمائي (عميق)</button>
            <button type="button" class="option-btn" onclick="setMood(this, 'ديناميكي')">⚡ ديناميكي (سريع)</button>
        </div>

        <button type="button" class="submit-btn" id="generateBtn" onclick="generateContent()">
            🚀 توليد البرومبت وبناء المشاهد الآن
        </button>

        <div id="statusBox" class="status-box"></div>

        <div id="resultsContainer" class="results-container">
            <div class="results-title">✨ المخرجات الهندسية الجاهزة لأداة VIDEO-LIKE:</div>
            <div id="scenesList"></div>
        </div>
    </div>

    <script>
        let selectedStyle = 'موشن جرافيك حديث';
        let selectedMood = 'سينمائي';

        function setStyle(btn, style) {
            document.querySelectorAll('#styleContainer .option-btn').forEach(b => b.classList.remove('active-style'));
            btn.classList.add('active-style');
            selectedStyle = style;
        }

        function setMood(btn, mood) {
            document.querySelectorAll('#moodContainer .option-btn').forEach(b => b.classList.remove('active-mood'));
            btn.classList.add('active-mood');
            selectedMood = mood;
        }

        async function generateContent() {
            const idea = document.getElementById('videoIdea').value.trim();
            const btn = document.getElementById('generateBtn');
            const statusBox = document.getElementById('statusBox');
            const resultsContainer = document.getElementById('resultsContainer');

            if (!idea) {
                alert('يرجى كتابة فكرة الفيديو في الخانة المخصصة أولاً!');
                return;
            }

            // تفعيل حالة التحميل
            btn.disabled = true;
            btn.innerText = '⏳ جاري هندسة المشاهد وتوليد البرومبت...';
            statusBox.className = 'status-box';
            statusBox.style.display = 'block';
